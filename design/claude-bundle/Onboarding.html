<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Onboarding — Erstanmeldung</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #f3efe9; font-family: Inter, system-ui, sans-serif; }
  * { box-sizing: border-box; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="steps-cgpt.jsx"></script>
<script type="text/babel" src="onboarding.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
  function ABoard({ id, label, comp: Comp }) {
    return (
      <window.DCArtboard id={id} label={label} width={390} height={780}>
        <Comp />
      </window.DCArtboard>
    );
  }

  function FlowBoard({ id, label }) {
    return (
      <window.DCArtboard id={id} label={label} width={430} height={920}>
        <window.IOSDevice width={390} height={844}>
          <window.OnboardingFlow />
        </window.IOSDevice>
      </window.DCArtboard>
    );
  }

  function Note() {
    const C = window.CGPT;
    return (
      <div style={{
        maxWidth: 820, margin: '0 auto 20px', padding: '20px 22px',
        background: C.bgWhite, border: `1px solid ${C.border}`, borderRadius: 14,
        fontFamily: 'Inter, sans-serif', fontSize: 13, lineHeight: 1.6, color: C.text2,
      }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: C.accent, textTransform: 'uppercase', letterSpacing: 0.8, marginBottom: 8 }}>
          Onboarding · 6-Step Flow
        </div>
        <div style={{ color: C.text, fontSize: 15, fontWeight: 600, marginBottom: 8, lineHeight: 1.4 }}>
          Welcome → Klasse → Lernziel → Selbsteinschätzung → Tagesziel → Bereit
        </div>
        <div>
          Eine ruhige, fokussierte Erstanmeldung. Selbsteinschätzung ist optional („Überspringen")
          — sonst beeinflusst sie die Reihenfolge der ersten Bausteine. Auf der letzten Seite eine
          Zusammenfassung + erster konkreter nächster Schritt (cabuu-inspiriert: aus dem schwächsten
          Bereich der Selbsteinschätzung).
        </div>
      </div>
    );
  }

  function App() {
    const W = window;
    return (
      <window.DesignCanvas
        title="Onboarding"
        subtitle="Erstanmeldung · 6 Schritte · Welcome bis Bereit"
      >
        <div style={{ marginBottom: 20 }}><Note /></div>

        <window.DCSection id="flow" title="Interaktiv · klickbarer 6-Step Flow">
          {FlowBoard({id: "fb-ob", label: "Welcome → Klasse → Ziel → Selbsteinsch. → Tagesziel → Fertig"})}
        </window.DCSection>

        <window.DCSection id="screens" title="Die 6 Screens">
          {ABoard({id: "ob-1", label: "1. Welcome",            comp: W.OBWelcomeStandalone})}
          {ABoard({id: "ob-2", label: "2. Klasse · Status",    comp: W.OBKlasseStandalone})}
          {ABoard({id: "ob-3", label: "3. Lernziel",           comp: W.OBLernzielStandalone})}
          {ABoard({id: "ob-4", label: "4. Selbsteinschätzung", comp: W.OBSelbstStandalone})}
          {ABoard({id: "ob-5", label: "5. Tagesziel",          comp: W.OBTageszielStandalone})}
          {ABoard({id: "ob-6", label: "6. Fertig · Plan",      comp: W.OBFertigStandalone})}
        </window.DCSection>
      </window.DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
