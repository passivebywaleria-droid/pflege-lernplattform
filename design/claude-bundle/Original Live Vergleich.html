<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Original Live — Vergleichs-Repro</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #f3efe9; font-family: 'Poppins', system-ui, sans-serif; }
  * { box-sizing: border-box; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="orig-repro.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
  function Note() {
    return (
      <div style={{
        maxWidth: 720, margin: '0 auto 24px', padding: 20,
        background: '#fffaf2', border: '1px solid #e8d9c1', borderRadius: 12,
        fontFamily: "'Poppins', sans-serif", fontSize: 14, lineHeight: 1.6, color: '#3a2f24',
      }}>
        <strong style={{ display: 'block', marginBottom: 6, color: '#C4877F' }}>
          Vergleich · Aktueller Live-Stand der Plattform
        </strong>
        <p style={{ margin: '0 0 8px 0' }}>
          Getreue Repro von <code>pflege-lernplattform.vercel.app</code> — gelesen aus dem Repo
          <code> passivebywaleria-droid/pflege-lernplattform</code> (situation/page.tsx, step-mc.tsx, step-text.tsx, step-confidence.tsx, phasen-progress.tsx, globals.css).
        </p>
        <p style={{ margin: 0, color: '#6e6e73', fontSize: 13 }}>
          Auffallend: Das Live-Design nutzt <strong>warmes Rosa</strong> (#C4877F) als Accent + <strong>Poppins</strong> — anders als die ChatGPT-Teal-Palette (#218C71, Inter)
          die in CLAUDE.md als „final" markiert ist. Die ChatGPT-Palette existiert nur in den HTML-Designs dieses Projekts, nicht im Live-Code.
        </p>
      </div>
    );
  }

  function App() {
    return (
      <window.DesignCanvas title="Live-Repro · Aktueller Stand" subtitle="Was Schüler:innen heute sehen">
        <div style={{ marginBottom: 20 }}><Note /></div>

        <window.DCSection id="phase1" title="Phase 1 · Informieren — wie es jetzt live aussieht">
          <window.DCArtboard id="orig-szene" label="Step 1 · Text (Scenario-Format)" width={390} height={780}>
            <window.OriginalScreen
              phaseId="informieren"
              phaseLabel="Informieren"
              phaseDesc="Sammle Informationen über den Patienten und die Situation"
              stepIdx={0} stepTotal={5}
              completedPhases={[]}
            >
              <window.OrigStepScenario />
            </window.OriginalScreen>
          </window.DCArtboard>

          <window.DCArtboard id="orig-mc" label="Step 2 · Multiple Choice" width={390} height={780}>
            <window.OriginalScreen
              phaseId="informieren"
              phaseLabel="Informieren"
              phaseDesc="Sammle Informationen über den Patienten und die Situation"
              stepIdx={1} stepTotal={5}
              completedPhases={[]}
            >
              <window.OrigStepMC />
            </window.OriginalScreen>
          </window.DCArtboard>

          <window.DCArtboard id="orig-confidence" label="Step 3 · Confidence (Wahr/Falsch)" width={390} height={780}>
            <window.OriginalScreen
              phaseId="informieren"
              phaseLabel="Informieren"
              phaseDesc="Sammle Informationen über den Patienten und die Situation"
              stepIdx={2} stepTotal={5}
              completedPhases={[]}
            >
              <window.OrigStepConfidence />
            </window.OriginalScreen>
          </window.DCArtboard>
        </window.DCSection>

        <window.DCSection id="phase4" title="Mitten in der Lernreise — Phase 4 von 6 (Diagnosen eingeklappt)">
          <window.DCArtboard id="orig-mid" label="Phase 4 · Durchführen" width={390} height={780}>
            <window.OriginalScreen
              phaseId="durchfuehren"
              phaseLabel="Durchführen"
              phaseDesc="Setze die geplanten Maßnahmen um"
              stepIdx={1} stepTotal={4}
              completedPhases={['informieren', 'beobachten', 'planen']}
            >
              <window.OrigStepMC />
            </window.OriginalScreen>
          </window.DCArtboard>
        </window.DCSection>
      </window.DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
