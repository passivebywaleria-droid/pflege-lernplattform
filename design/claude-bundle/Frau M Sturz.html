<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Frau M. · Nächtlicher Sturz · CE-02</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: #E8E0D6; font-family: Inter, sans-serif; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="steps-cgpt.jsx"></script>
  <script type="text/babel" src="frau-m-data.jsx"></script>
  <script type="text/babel" src="frau-m-steps.jsx"></script>

  <script type="text/babel" data-presets="react">
    const W = 390, H = 780;

    const screens = [
      { id: 'scene',    label: '00 · Phase 1 · Szene & Ankommen',     C: () => <FrauMScene /> },
      { id: 'sbar',     label: '01 · Phase 1 · SBAR-Übergabe',       C: () => <FrauMSBAR /> },
      { id: 'conf',     label: '02 · Phase 1 · Selbsteinschätzung',  C: () => <FrauMConfidence /> },
      { id: 'mc',       label: '03 · Phase 1 · MC „erste Priorität"', C: () => <FrauMMC /> },
      { id: 'dialog',   label: '04 · Phase 1 · Dialog mit Frau M.',  C: () => <FrauMDialog /> },
      { id: 'sort',     label: '05 · Phase 1 · Assessment-Sortierung', C: () => <FrauMSort /> },
      { id: 'hl',       label: '06 · Phase 2 · Medikamente markieren', C: () => <FrauMHighlight /> },
      { id: 'cat',      label: '07 · Phase 2 · Risiken kategorisieren', C: () => <FrauMCategorize /> },
      { id: 'branch',   label: '08 · Phase 4 · Branching Mobilisation', C: () => <FrauMBranching /> },
      { id: 'protocol', label: '09 · Phase 5 · Sturzprotokoll',      C: () => <FrauMProtocol /> },
      { id: 'done',     label: '10 · Phase 6 · Situation geschafft', C: () => <FrauMDone /> },
    ];

    function App() {
      return (
        <DesignCanvas>
          <DCSection
            id="frau-m"
            title="CE-02 · Frau Marianne M., 82 — Nächtlicher Sturz"
            subtitle="Echte Inhalte aus dem Repo (phase-informieren.ts u.a.). 10 Schlüssel-Steps aus 30 über 6 Phasen. Sticky-Header mit Patient + 6-Phasen-Bar. ChatGPT-Palette."
          >
            {screens.map((s) => (
              <DCArtboard key={s.id} id={s.id} label={s.label} width={W} height={H}>
                <IOSDevice width={W} height={H}>
                  <s.C />
                </IOSDevice>
              </DCArtboard>
            ))}
          </DCSection>

          <DCPostIt x={60} y={60} rotation={-2}>
            <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 6 }}>Frau M. · Nacht-Sturz</div>
            <div style={{ fontSize: 11, lineHeight: 1.45, color: '#6B5E52' }}>
              Quelle: <code>content/ce-02/situationen/frau-m-nacht-sturz/</code>
              <br /><br />
              Sturz 02:48 · Pneumonie + Parkinson + neu Zolpidem (PRISCUS-PIM)
              <br /><br />
              Klick Artboard → Fokus.
            </div>
          </DCPostIt>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
