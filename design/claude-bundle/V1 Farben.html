<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>V1 · Farb-Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: #E8E0D6; font-family: Inter, system-ui, sans-serif; }
    * { -webkit-font-smoothing: antialiased; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="palettes.jsx"></script>
  <script type="text/babel" src="v1-palette.jsx"></script>

  <script type="text/babel" data-presets="react">
    const W = 390, H = 780;

    function App() {
      return (
        <DesignCanvas>
          <DCSection
            id="linen-steps"
            title="Linen · Helligkeits-Stufen"
            subtitle="Linen-Hintergrund von dunkel → hell. Favorit A4 (EFEBE4) als Ausgang, dann 3 hellere Stufen."
          >
            {PALETTES_BG.filter(p => p.id.startsWith('tt-linen')).map((p) => (
              <DCArtboard key={p.id} id={`sc-${p.id}`} label={p.name} width={W} height={H}>
                <IOSDevice width={W} height={H}>
                  <V1SituationPalette palette={p} />
                </IOSDevice>
              </DCArtboard>
            ))}
          </DCSection>

          <DCSection
            id="tt-screens"
            title="Terracotta + Teal · Andere BG-Varianten"
            subtitle="Zum Vergleich: Cream · Paper · Tinted (nicht-Linen)"
          >
            {PALETTES_BG.filter(p => p.id.startsWith('tt-') && !p.id.startsWith('tt-linen')).map((p) => (
              <DCArtboard key={p.id} id={`sc-${p.id}`} label={p.name} width={W} height={H}>
                <IOSDevice width={W} height={H}>
                  <V1SituationPalette palette={p} />
                </IOSDevice>
              </DCArtboard>
            ))}
          </DCSection>

          <DCSection
            id="rs-screens"
            title="Rust + Stone · Hintergrund-Varianten"
            subtitle="Gleiche Accent-Farben (#AA5A42 / #6B6258) — 4 verschiedene BGs: Bone · Sand · Mist · Pure White"
          >
            {PALETTES_BG.filter(p => p.id.startsWith('rs-')).map((p) => (
              <DCArtboard key={p.id} id={`sc-${p.id}`} label={p.name} width={W} height={H}>
                <IOSDevice width={W} height={H}>
                  <V1SituationPalette palette={p} />
                </IOSDevice>
              </DCArtboard>
            ))}
          </DCSection>

          <DCSection
            id="swatches"
            title="BG-Swatches zum Vergleich"
            subtitle="App-Background (links) vs. Card-Background (rechts) jeder Variante"
          >
            {PALETTES_BG.map((p) => (
              <DCArtboard key={p.id} id={`sw-${p.id}`} label={p.name} width={260} height={160}>
                <div style={{ width: '100%', height: '100%', background: p.bg, padding: 16, fontFamily: 'Inter, sans-serif', borderRadius: 8, border: `1px solid ${p.borderStrong}` }}>
                  <div style={{ fontSize: 12, fontWeight: 600, color: p.text, marginBottom: 4 }}>{p.name}</div>
                  <div style={{ fontSize: 10, color: p.text3, marginBottom: 12 }}>{p.sub}</div>
                  <div style={{ display: 'flex', gap: 6 }}>
                    <div style={{ flex: 1, height: 36, borderRadius: 6, background: p.bg, border: `1px solid ${p.borderStrong}`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 9, fontFamily: 'ui-monospace, monospace', color: p.text3 }}>{p.bg}</div>
                    <div style={{ flex: 1, height: 36, borderRadius: 6, background: p.bgWhite, border: `1px solid ${p.borderStrong}`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 9, fontFamily: 'ui-monospace, monospace', color: p.text3 }}>{p.bgWhite}</div>
                  </div>
                  <div style={{ display: 'flex', gap: 6, marginTop: 8 }}>
                    <div style={{ flex: 1, height: 18, borderRadius: 4, background: p.accent }} />
                    <div style={{ flex: 1, height: 18, borderRadius: 4, background: p.success }} />
                  </div>
                </div>
              </DCArtboard>
            ))}
          </DCSection>

          <DCPostIt x={60} y={60} rotation={-2}>
            <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 6 }}>BG-Varianten</div>
            <div style={{ fontSize: 11, lineHeight: 1.4, color: '#6B5E52' }}>
              Oben: Terracotta + Teal mit 4 verschiedenen BGs.
              Mitte: Rust + Stone mit 4 BGs.
              <br /><br />
              <b>Cream / Bone</b> = warm, original<br />
              <b>Paper / Sand</b> = wärmer, mehr Textur-Gefühl<br />
              <b>Tinted / Mist</b> = leicht farbiger Stich<br />
              <b>Linen / Pure</b> = kühler/neutraler
            </div>
          </DCPostIt>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
