<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>App-Referenzen · Farb-Exploration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: #E8E0D6; font-family: Inter, system-ui, sans-serif; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="palettes.jsx"></script>
  <script type="text/babel" src="palettes-apps.jsx"></script>
  <script type="text/babel" src="v1-palette.jsx"></script>

  <script type="text/babel" data-presets="react">
    const W = 390, H = 780;

    function AppRefCard({ app }) {
      return (
        <div style={{
          width: '100%', height: '100%',
          background: app.bg, borderRadius: 8, overflow: 'hidden',
          display: 'flex', flexDirection: 'column',
          border: '1px solid rgba(0,0,0,0.08)',
        }}>
          <div style={{ flex: 1, background: app.color, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <div style={{
              width: 48, height: 48, borderRadius: 12, background: app.bg,
              color: app.color, fontSize: 24, fontWeight: 700,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontFamily: 'Inter, sans-serif',
            }}>{app.name[0]}</div>
          </div>
          <div style={{ padding: '10px 12px', background: app.bg }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: app.color === '#000000' ? '#000' : '#0A0908' }}>{app.name}</div>
            <div style={{ fontSize: 10, color: '#6B5E52', marginTop: 2, fontFamily: 'ui-monospace, monospace' }}>{app.color}</div>
            <div style={{ fontSize: 10, color: '#998B7E', marginTop: 3 }}>{app.note}</div>
          </div>
        </div>
      );
    }

    function App() {
      return (
        <DesignCanvas>
          <DCSection
            id="refs"
            title="Was Pflegeschüler:innen kennen · App-Referenzen 2026"
            subtitle="Beliebte Apps & ihre Signaturfarben. Beobachtung: Die meisten haben EINE dominante Farbe + neutralen BG. Lernen-Apps tendieren zu Grün/Blau, Social zu Schwarz/Weiß."
          >
            {APP_REFS.map((app) => (
              <DCArtboard key={app.id} id={`ref-${app.id}`} label={app.name} width={180} height={200}>
                <AppRefCard app={app} />
              </DCArtboard>
            ))}
          </DCSection>

          <DCSection
            id="inspired"
            title="Neue Vorschläge · App-inspiriert für Pflege"
            subtitle="4 neue Richtungen, die visuelle Muster bekannter Apps aufgreifen — aber mit warmer Basis für die Pflege-Identität. Jede Palette respektiert --lern-* Token-Struktur."
          >
            {PALETTES_APP_INSPIRED.map((p) => (
              <DCArtboard key={p.id} id={`sc-${p.id}`} label={p.name} width={W} height={H}>
                <IOSDevice width={W} height={H}>
                  <V1SituationPalette palette={p} />
                </IOSDevice>
              </DCArtboard>
            ))}
          </DCSection>

          <DCSection
            id="tt-rs-screens"
            title="Zum Vergleich · Deine Favoriten aus vorheriger Runde"
            subtitle="Terracotta+Teal (A) und Rust+Stone (F) mit den Original-BGs, damit du direkt nebeneinander vergleichen kannst."
          >
            {PALETTES_BG.filter(p => p.id === 'tt-cream' || p.id === 'rs-bone').map((p) => (
              <DCArtboard key={p.id} id={`cmp-${p.id}`} label={p.name} width={W} height={H}>
                <IOSDevice width={W} height={H}>
                  <V1SituationPalette palette={p} />
                </IOSDevice>
              </DCArtboard>
            ))}
          </DCSection>

          <DCPostIt x={60} y={60} rotation={-2}>
            <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 6 }}>App-Referenzen</div>
            <div style={{ fontSize: 11, lineHeight: 1.4, color: '#6B5E52' }}>
              Was Pflegeschüler:innen (18-25) täglich nutzen:
              <br /><br />
              <b>Lern-Apps</b> → Grün (Duolingo), Blau (Quizlet), Teal (ChatGPT)<br />
              <b>Social</b> → Schwarz/Weiß (Threads, BeReal, TikTok)<br />
              <b>Productivity</b> → Monochrom-Grau + 1 Akzent (Notion)
              <br /><br />
              <b>Mein Take:</b> Neutrale warme Basis + EIN klarer Akzent funktioniert 2026 am besten. Grell-Grün ist für Duolingo reserviert — für Pflege zu verspielt.
            </div>
          </DCPostIt>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
