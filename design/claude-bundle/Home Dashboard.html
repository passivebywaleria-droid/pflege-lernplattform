<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Home Dashboard — Schüler:innen-Hauptscreen</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #f3efe9; font-family: Inter, system-ui, sans-serif; }
  * { box-sizing: border-box; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="steps-cgpt.jsx"></script>
<script type="text/babel" src="bausteine.jsx"></script>
<script type="text/babel" src="v1-flow-bausteine.jsx"></script>
<script type="text/babel" src="tabbar.jsx"></script>
<script type="text/babel" src="magic-ui.jsx"></script>
<script type="text/babel" src="home.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
  function ABoard({ id, label, comp: Comp }) {
    return (
      <window.DCArtboard id={id} label={label} width={390} height={780}>
        <Comp />
      </window.DCArtboard>
    );
  }

  function FlowBoard({ id, label }) {
    return (
      <window.DCArtboard id={id} label={label} width={430} height={920}>
        <window.IOSDevice width={390} height={844}>
          <window.HomeTabApp />
        </window.IOSDevice>
      </window.DCArtboard>
    );
  }

  function Note() {
    const C = window.CGPT;
    return (
      <div style={{
        maxWidth: 820, margin: '0 auto 20px', padding: '20px 22px',
        background: C.bgWhite, border: `1px solid ${C.border}`, borderRadius: 14,
        fontFamily: 'Inter, sans-serif', fontSize: 13, lineHeight: 1.6, color: C.text2,
      }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: C.accent, textTransform: 'uppercase', letterSpacing: 0.8, marginBottom: 8 }}>
          Home / Dashboard · Tab-Bar · 4 Hauptscreens
        </div>
        <div style={{ color: C.text, fontSize: 15, fontWeight: 600, marginBottom: 8, lineHeight: 1.4 }}>
          Was Schüler:innen nach dem Login sehen.
        </div>
        <div>
          Globale Tab-Bar mit 4 Tabs: <strong>Home · Lernen · Karten · Ich</strong>.
          Im Flow-Board kannst du zwischen den Tabs wechseln. Home zeigt: Greeting,
          „Weiter wo aufgehört"-Card (groß), Streak/Mastery/Karten-Stats, „Heute fällig",
          aktive Bausteine, empfohlener nächster Baustein, Schnellzugriff.
        </div>
      </div>
    );
  }

  function App() {
    const W = window;
    return (
      <window.DesignCanvas
        title="Home & Tab-Navigation"
        subtitle="Dashboard · Tab-Bar · Karten · Ich"
      >
        <div style={{ marginBottom: 20 }}><Note /></div>

        <window.DCSection id="flow" title="Interaktiv · klickbare Tabs">
          {FlowBoard({id: "fb-tabs", label: "Tippe die Tabs unten — Home / Lernen / Karten / Ich"})}
        </window.DCSection>

        <window.DCSection id="screens" title="Die 4 Tab-Screens">
          {ABoard({id: "t-home",  label: "1. Home · Dashboard",       comp: W.HomeStandalone})}
          {ABoard({id: "t-learn", label: "2. Lernen · CE-Übersicht",  comp: W.LearnStandalone})}
          {ABoard({id: "t-cards", label: "3. Karten · Spaced Repetition", comp: W.CardsStandalone})}
          {ABoard({id: "t-me",    label: "4. Ich · Mastery & Profil", comp: W.MeStandalone})}
        </window.DCSection>

        <window.DCSection id="anatomy" title="Home · Anatomie">
          <window.DCArtboard id="ana" label="Sektionen & Hierarchie" width={760} height={680}>
            <Anatomy />
          </window.DCArtboard>
        </window.DCSection>
      </window.DesignCanvas>
    );
  }

  function Anatomy() {
    const C = window.CGPT;
    const sektionen = [
      { name: 'Greeting', purpose: 'Tageszeit · Name · Avatar · Benachrichtigungs-Badge' },
      { name: 'Continue-Card (Hero)', purpose: 'Letzter Baustein/Step · großer Tap-Target · ~7 min noch' },
      { name: 'Stats-Strip', purpose: 'Streak · Bausteine · Heutige Karten — 3 kompakte KPI-Pills' },
      { name: 'Heute fällig', purpose: 'Karteikarten · überfällige Reflektionen — mit Dringlichkeits-Badges' },
      { name: 'Du arbeitest gerade an', purpose: 'Aktive Bausteine mit Mastery-Ring + Progress-Bar' },
      { name: 'Empfohlen', purpose: 'Nächster Baustein · KI-Begründung · Vorschau-CTA' },
      { name: 'Schnellzugriff', purpose: '2×2-Grid: Pflege-Situationen · Glossar · Mastery-Karte · Suche' },
      { name: 'Tab-Bar', purpose: 'Home · Lernen · Karten · Ich (sticky bottom, iOS-style)' },
    ];
    return (
      <div style={{
        width: '100%', height: '100%', background: C.bg, padding: '24px 28px',
        fontFamily: 'Inter, sans-serif', overflow: 'auto',
      }}>
        <div style={{ fontSize: 11, color: C.accent, letterSpacing: 1, textTransform: 'uppercase', fontWeight: 700, marginBottom: 6 }}>
          Sektionen von oben nach unten
        </div>
        <div style={{ fontSize: 13, color: C.text3, marginBottom: 18, lineHeight: 1.5 }}>
          Information-Density nimmt nach unten ab. Das Wichtigste (Continue) hat den meisten Raum.
        </div>
        {sektionen.map((s, i) => (
          <div key={i} style={{
            display: 'flex', gap: 14, padding: '12px 0',
            borderBottom: i < sektionen.length - 1 ? `1px solid ${C.borderStrong}` : 'none',
          }}>
            <div style={{
              width: 26, height: 26, borderRadius: 13, flexShrink: 0,
              background: C.accentSoft, color: C.accent,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontSize: 11, fontWeight: 700,
            }}>{i + 1}</div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 14, fontWeight: 600, color: C.text }}>{s.name}</div>
              <div style={{ fontSize: 12, color: C.text2, marginTop: 3, lineHeight: 1.5 }}>{s.purpose}</div>
            </div>
          </div>
        ))}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
