<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #5a524a; text-anchor: middle; }
      .num { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #fff; text-anchor: middle; dominant-baseline: central; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #3d3830; text-anchor: middle; }
      .arrow { fill: none; stroke: #E5DFD6; stroke-width: 1.5; marker-end: url(#arrowhead); }
      .figure { stroke: #C4877F; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .head { fill: #C4877F; stroke: none; }
      .ground { stroke: #E5DFD6; stroke-width: 1.5; stroke-dasharray: 4 3; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#E5DFD6" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" rx="12" fill="#fafaf9"/>

  <!-- Title -->
  <text x="400" y="24" class="title">7 Grundpositionen der Kinästhetik — aufsteigend nach Komplexität</text>

  <!-- Progression arrow -->
  <line x1="42" y1="248" x2="758" y2="248" class="arrow"/>
  <text x="60" y="264" class="label" style="fill:#C4877F; font-size:9px;">einfach</text>
  <text x="740" y="264" class="label" style="fill:#6B8F71; font-size:9px;">komplex</text>

  <!-- Ground lines per figure -->
  <g class="ground">
    <line x1="20" y1="232" x2="90" y2="232"/>
    <line x1="100" y1="232" x2="175" y2="232"/>
    <line x1="185" y1="232" x2="260" y2="232"/>
    <line x1="270" y1="232" x2="355" y2="232"/>
    <line x1="365" y1="232" x2="450" y2="232"/>
    <line x1="475" y1="232" x2="545" y2="232"/>
    <line x1="600" y1="232" x2="670" y2="232"/>
  </g>

  <!-- === 1. Rückenlage === -->
  <g transform="translate(55, 0)">
    <!-- Number badge -->
    <circle cx="0" cy="46" r="10" fill="#C4877F"/>
    <text x="0" y="46" class="num">1</text>
    <!-- Stick figure lying flat -->
    <circle cx="-28" cy="218" r="8" class="head"/>
    <line x1="-20" y1="218" x2="25" y2="218" class="figure"/><!-- torso horizontal -->
    <line x1="25" y1="218" x2="38" y2="225" class="figure"/><!-- upper leg -->
    <line x1="38" y1="225" x2="38" y2="218" class="figure"/><!-- lower leg (flat) -->
    <line x1="-12" y1="218" x2="-8" y2="228" class="figure"/><!-- arm down -->
    <!-- Label -->
    <text x="0" y="280" class="label">Rückenlage</text>
  </g>

  <!-- === 2. Bauchlage Ellbogenstütz === -->
  <g transform="translate(138, 0)">
    <circle cx="0" cy="46" r="10" fill="#C4877F" opacity="0.9"/>
    <text x="0" y="46" class="num">2</text>
    <!-- Prone with elbow support, head up -->
    <circle cx="-18" cy="188" r="8" class="head"/>
    <line x1="-18" y1="196" x2="-14" y2="215" class="figure"/><!-- neck to upper torso (angled up) -->
    <line x1="-14" y1="215" x2="28" y2="225" class="figure"/><!-- torso sloping down -->
    <line x1="28" y1="225" x2="36" y2="230" class="figure"/><!-- upper leg -->
    <line x1="-14" y1="215" x2="-18" y2="230" class="figure"/><!-- elbow support arm -->
    <text x="0" y="280" class="label" style="font-size:9px">Bauchlage +</text>
    <text x="0" y="291" class="label" style="font-size:9px">Ellbogenstütz</text>
  </g>

  <!-- === 3. Schneidersitz === -->
  <g transform="translate(223, 0)">
    <circle cx="0" cy="46" r="10" fill="#C4877F" opacity="0.8"/>
    <text x="0" y="46" class="num">3</text>
    <!-- Sitting cross-legged -->
    <circle cx="0" cy="165" r="8" class="head"/>
    <line x1="0" y1="173" x2="0" y2="210" class="figure"/><!-- spine -->
    <line x1="0" y1="210" x2="-18" y2="225" class="figure"/><!-- left leg cross -->
    <line x1="0" y1="210" x2="18" y2="225" class="figure"/><!-- right leg cross -->
    <line x1="-18" y1="225" x2="-6" y2="230" class="figure"/><!-- left foot tuck -->
    <line x1="18" y1="225" x2="6" y2="230" class="figure"/><!-- right foot tuck -->
    <line x1="0" y1="185" x2="-14" y2="205" class="figure"/><!-- left arm on knee -->
    <line x1="0" y1="185" x2="14" y2="205" class="figure"/><!-- right arm on knee -->
    <text x="0" y="280" class="label">Schneidersitz</text>
  </g>

  <!-- === 4. Vierfüßlerstand === -->
  <g transform="translate(313, 0)">
    <circle cx="0" cy="46" r="10" fill="#b09080"/>
    <text x="0" y="46" class="num">4</text>
    <!-- Hands and knees -->
    <circle cx="-20" cy="175" r="8" class="head"/>
    <line x1="-20" y1="183" x2="-10" y2="195" class="figure"/><!-- neck -->
    <line x1="-10" y1="195" x2="15" y2="195" class="figure"/><!-- back horizontal -->
    <line x1="15" y1="195" x2="15" y2="230" class="figure"/><!-- back leg down -->
    <line x1="-10" y1="195" x2="-10" y2="230" class="figure"/><!-- front arm down -->
    <line x1="15" y1="215" x2="28" y2="215" class="figure"/><!-- back foot -->
    <line x1="-10" y1="215" x2="-22" y2="215" class="figure"/><!-- front hand -->
    <text x="0" y="280" class="label" style="font-size:9px">Vierfüßler-</text>
    <text x="0" y="291" class="label" style="font-size:9px">stand</text>
  </g>

  <!-- === 5. Einbein-Knie-Stand === -->
  <g transform="translate(408, 0)">
    <circle cx="0" cy="46" r="10" fill="#8a9a80"/>
    <text x="0" y="46" class="num">5</text>
    <!-- One knee down, one foot forward -->
    <circle cx="0" cy="145" r="8" class="head"/>
    <line x1="0" y1="153" x2="0" y2="195" class="figure"/><!-- spine -->
    <line x1="0" y1="195" x2="-12" y2="220" class="figure"/><!-- left leg (knee down) -->
    <line x1="-12" y1="220" x2="-20" y2="230" class="figure"/><!-- left shin back -->
    <line x1="0" y1="195" x2="15" y2="215" class="figure"/><!-- right thigh forward -->
    <line x1="15" y1="215" x2="15" y2="230" class="figure"/><!-- right shin down -->
    <line x1="0" y1="170" x2="-12" y2="185" class="figure"/><!-- left arm -->
    <line x1="0" y1="170" x2="14" y2="180" class="figure"/><!-- right arm on knee -->
    <text x="0" y="280" class="label" style="font-size:9px">Einbein-</text>
    <text x="0" y="291" class="label" style="font-size:9px">Knie-Stand</text>
  </g>

  <!-- === 6. Einbeinstand === -->
  <g transform="translate(510, 0)">
    <circle cx="0" cy="46" r="10" fill="#6B8F71" opacity="0.85"/>
    <text x="0" y="46" class="num">6</text>
    <!-- Standing on one leg, other raised -->
    <circle cx="0" cy="115" r="8" class="head"/>
    <line x1="0" y1="123" x2="0" y2="175" class="figure"/><!-- spine -->
    <line x1="0" y1="175" x2="0" y2="230" class="figure"/><!-- standing leg -->
    <line x1="0" y1="175" x2="18" y2="195" class="figure"/><!-- raised thigh -->
    <line x1="18" y1="195" x2="12" y2="210" class="figure"/><!-- raised calf -->
    <line x1="0" y1="145" x2="-14" y2="155" class="figure"/><!-- left arm balance -->
    <line x1="0" y1="145" x2="14" y2="155" class="figure"/><!-- right arm balance -->
    <text x="0" y="280" class="label">Einbeinstand</text>
  </g>

  <!-- === 7. Zweibeinstand === -->
  <g transform="translate(635, 0)">
    <circle cx="0" cy="46" r="10" fill="#6B8F71"/>
    <text x="0" y="46" class="num">7</text>
    <!-- Normal standing -->
    <circle cx="0" cy="110" r="8" class="head"/>
    <line x1="0" y1="118" x2="0" y2="175" class="figure"/><!-- spine -->
    <line x1="0" y1="175" x2="-10" y2="230" class="figure"/><!-- left leg -->
    <line x1="0" y1="175" x2="10" y2="230" class="figure"/><!-- right leg -->
    <line x1="0" y1="140" x2="-14" y2="165" class="figure"/><!-- left arm -->
    <line x1="0" y1="140" x2="14" y2="165" class="figure"/><!-- right arm -->
    <text x="0" y="280" class="label">Zweibeinstand</text>
  </g>

  <!-- Complexity gradient bar -->
  <defs>
    <linearGradient id="complexGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C4877F"/>
      <stop offset="100%" stop-color="#6B8F71"/>
    </linearGradient>
  </defs>
  <rect x="40" y="242" width="720" height="3" rx="1.5" fill="url(#complexGrad)" opacity="0.5"/>
</svg>