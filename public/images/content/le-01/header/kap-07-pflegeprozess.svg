<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="400" y2="320">
      <stop offset="0%" stop-color="#FDF2F0"/>
      <stop offset="100%" stop-color="#EFF5F0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="320" rx="16" fill="url(#bg7)"/>

  <text x="200" y="28" text-anchor="middle" fill="#6B5450" font-size="13" font-family="system-ui" font-weight="600" letter-spacing="1.5">PFLEGEPROZESS — 6 PHASEN</text>

  <!-- Steps vertical with connecting line -->
  <line x1="50" y1="48" x2="50" y2="280" stroke="#6B8F71" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Phase 1 -->
  <circle cx="50" cy="60" r="14" fill="#6B8F71" opacity="0.15" stroke="#6B8F71" stroke-width="1.5"/>
  <text x="50" y="65" text-anchor="middle" fill="#4A6A50" font-size="12" font-family="system-ui" font-weight="700">1</text>
  <text x="75" y="58" fill="#4A6A50" font-size="12" font-family="system-ui" font-weight="600">Informationen sammeln</text>
  <text x="75" y="72" fill="#6B8F71" font-size="10" font-family="system-ui">Was wissen wir über den Patienten?</text>

  <!-- Phase 2 -->
  <circle cx="50" cy="100" r="14" fill="#6B8F71" opacity="0.15" stroke="#6B8F71" stroke-width="1.5"/>
  <text x="50" y="105" text-anchor="middle" fill="#4A6A50" font-size="12" font-family="system-ui" font-weight="700">2</text>
  <text x="75" y="98" fill="#4A6A50" font-size="12" font-family="system-ui" font-weight="600">Probleme + Stärken erkennen</text>
  <text x="75" y="112" fill="#6B8F71" font-size="10" font-family="system-ui">Wo braucht er Hilfe? Was kann er?</text>

  <!-- Phase 3 -->
  <circle cx="50" cy="140" r="14" fill="#C4877F" opacity="0.15" stroke="#C4877F" stroke-width="1.5"/>
  <text x="50" y="145" text-anchor="middle" fill="#8B6B66" font-size="12" font-family="system-ui" font-weight="700">3</text>
  <text x="75" y="138" fill="#8B6B66" font-size="12" font-family="system-ui" font-weight="600">Ziele formulieren (SMART)</text>
  <text x="75" y="152" fill="#C4877F" font-size="10" font-family="system-ui">Was soll sich verändern? Bis wann?</text>

  <!-- Phase 4 -->
  <circle cx="50" cy="180" r="14" fill="#C4877F" opacity="0.15" stroke="#C4877F" stroke-width="1.5"/>
  <text x="50" y="185" text-anchor="middle" fill="#8B6B66" font-size="12" font-family="system-ui" font-weight="700">4</text>
  <text x="75" y="178" fill="#8B6B66" font-size="12" font-family="system-ui" font-weight="600">Maßnahmen planen</text>
  <text x="75" y="192" fill="#C4877F" font-size="10" font-family="system-ui">Welche Schritte zum Ziel?</text>

  <!-- Phase 5 -->
  <circle cx="50" cy="220" r="14" fill="#B8926E" opacity="0.15" stroke="#B8926E" stroke-width="1.5"/>
  <text x="50" y="225" text-anchor="middle" fill="#8B7355" font-size="12" font-family="system-ui" font-weight="700">5</text>
  <text x="75" y="218" fill="#8B7355" font-size="12" font-family="system-ui" font-weight="600">Pflege durchführen</text>
  <text x="75" y="232" fill="#B8926E" font-size="10" font-family="system-ui">Umsetzen + dokumentieren</text>

  <!-- Phase 6 -->
  <circle cx="50" cy="260" r="14" fill="#B8926E" opacity="0.15" stroke="#B8926E" stroke-width="1.5"/>
  <text x="50" y="265" text-anchor="middle" fill="#8B7355" font-size="12" font-family="system-ui" font-weight="700">6</text>
  <text x="75" y="258" fill="#8B7355" font-size="12" font-family="system-ui" font-weight="600">Ergebnis bewerten</text>
  <text x="75" y="272" fill="#B8926E" font-size="10" font-family="system-ui">Besser? Falls nicht → zurück zu 1</text>

  <!-- Regelkreis arrow -->
  <path d="M36,265 Q15,160 36,60" stroke="#4A6A50" stroke-width="1.5" fill="none" stroke-dasharray="3 2" marker-end="url(#a7)"/>
  <defs><marker id="a7" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5" fill="#4A6A50"/></marker></defs>
  <text x="18" y="165" fill="#4A6A50" font-size="8" font-family="system-ui" font-weight="600" transform="rotate(-90,18,165)">REGELKREIS</text>

  <!-- Footer -->
  <rect x="80" y="290" width="240" height="22" rx="11" fill="#6B8F71" opacity="0.1" stroke="#6B8F71" stroke-width="1"/>
  <text x="200" y="305" text-anchor="middle" fill="#4A6A50" font-size="10" font-family="system-ui" font-weight="600">§ 5 PflBG: Vorbehaltene Tätigkeit!</text>
</svg>