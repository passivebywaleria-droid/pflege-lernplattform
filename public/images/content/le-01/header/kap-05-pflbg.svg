  <rect x="147" y="235" width="105" height="36" rx="8" fill="white" stroke="#C4877F" stroke-width="1"/>
  <text x="200" y="250" text-anchor="middle" fill="#8B6B66" font-size="10" font-family="system-ui">Wahlmöglichkeit</text>
  <text x="200" y="263" text-anchor="middle" fill="#C4877F" font-size="10" font-family="system-ui" font-weight="600">im 3. Jahr</text>

  <rect x="265" y="235" width="105" height="36" rx="8" fill="white" stroke="#B8926E" stroke-width="1"/>
  <text x="317" y="250" text-anchor="middle" fill="#8B7355" font-size="10" font-family="system-ui">Zugang ab</text>
