<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="400" y2="280">
      <stop offset="0%" stop-color="#EFF5F0"/>
      <stop offset="100%" stop-color="#F0E8E6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="16" fill="url(#bg6)"/>

  <text x="200" y="28" text-anchor="middle" fill="#4A6A50" font-size="13" font-family="system-ui" font-weight="600" letter-spacing="1.5">DREI DIMENSIONEN</text>

  <!-- Fachkompetenz -->
  <rect x="30" y="44" width="340" height="55" rx="12" fill="white" stroke="#6B8F71" stroke-width="1.5"/>
  <circle cx="60" cy="71" r="16" fill="#6B8F71" opacity="0.15"/>
  <text x="60" y="76" text-anchor="middle" fill="#4A6A50" font-size="14" font-family="system-ui" font-weight="700">F</text>
  <text x="90" y="66" fill="#4A6A50" font-size="13" font-family="system-ui" font-weight="600">Fachkompetenz</text>
  <text x="90" y="83" fill="#5A7A60" font-size="11" font-family="system-ui">Wissen + Können · Unterricht</text>

  <!-- Sozialkompetenz -->
  <rect x="30" y="108" width="340" height="55" rx="12" fill="white" stroke="#C4877F" stroke-width="1.5"/>
  <circle cx="60" cy="135" r="16" fill="#C4877F" opacity="0.15"/>
  <text x="60" y="140" text-anchor="middle" fill="#8B6B66" font-size="14" font-family="system-ui" font-weight="700">S</text>
  <text x="90" y="130" fill="#8B6B66" font-size="13" font-family="system-ui" font-weight="600">Sozialkompetenz</text>
  <text x="90" y="147" fill="#9B8580" font-size="11" font-family="system-ui">Empathie + Teamfähigkeit · Praxis</text>

  <!-- Personale Kompetenz -->
  <rect x="30" y="172" width="340" height="55" rx="12" fill="white" stroke="#B8926E" stroke-width="1.5"/>
  <circle cx="60" cy="199" r="16" fill="#B8926E" opacity="0.15"/>
  <text x="60" y="204" text-anchor="middle" fill="#8B7355" font-size="14" font-family="system-ui" font-weight="700">P</text>
  <text x="90" y="194" fill="#8B7355" font-size="13" font-family="system-ui" font-weight="600">Personale Kompetenz</text>
  <text x="90" y="211" fill="#9B8B75" font-size="11" font-family="system-ui">Reflexion + Haltung · Selbsterkenntnis</text>

  <!-- Result -->
  <text x="200" y="245" text-anchor="middle" fill="#888" font-size="12" font-family="system-ui">↓  ↓  ↓</text>
  <rect x="80" y="252" width="240" height="22" rx="11" fill="#4A6A50" opacity="0.1" stroke="#4A6A50" stroke-width="1"/>
  <text x="200" y="268" text-anchor="middle" fill="#4A6A50" font-size="12" font-family="system-ui" font-weight="600">= Handlungskompetenz</text>
</svg>