<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="400" y2="280">
      <stop offset="0%" stop-color="#EFF5F0"/>
      <stop offset="100%" stop-color="#E5EDE7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="16" fill="url(#bg2)"/>

  <text x="200" y="32" text-anchor="middle" fill="#4A6A50" font-size="13" font-family="system-ui" font-weight="600" letter-spacing="1.5">ZWEI PERSPEKTIVEN AUF PFLEGE</text>

  <rect x="30" y="50" width="340" height="70" rx="12" fill="white" stroke="#6B8F71" stroke-width="1.5"/>
  <text x="50" y="75" fill="#6B8F71" font-size="16" font-family="system-ui" font-weight="700">ICN</text>
  <text x="50" y="93" fill="#5A7A60" font-size="12" font-family="system-ui">WER wird gepflegt? WIE autonom?</text>
  <text x="50" y="108" fill="#7B9B80" font-size="11" font-family="system-ui">Alle Menschen, eigenverantwortlich</text>

  <text x="200" y="142" text-anchor="middle" fill="#888" font-size="18" font-family="system-ui">+</text>

  <rect x="30" y="152" width="340" height="70" rx="12" fill="white" stroke="#C4877F" stroke-width="1.5"/>
  <text x="50" y="177" fill="#C4877F" font-size="16" font-family="system-ui" font-weight="700">WHO</text>
  <text x="50" y="195" fill="#8B6B66" font-size="12" font-family="system-ui">WOZU ist Pflege da?</text>
  <text x="50" y="210" fill="#9B8580" font-size="11" font-family="system-ui">Befähigung, nicht nur Versorgung</text>

  <text x="200" y="245" text-anchor="middle" fill="#888" font-size="14" font-family="system-ui">↓</text>
  <rect x="100" y="250" width="200" height="24" rx="12" fill="#6B8F71" opacity="0.15"/>
  <text x="200" y="267" text-anchor="middle" fill="#4A6A50" font-size="12" font-family="system-ui" font-weight="600">Pflege als Profession</text>
