<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Menschlicher Körper in Rückenlage">
  <title>Menschlicher Körper in Rückenlage — Prädilektionsstellen für Dekubitus</title>
  <desc>Schematische Darstellung eines Menschen in Rückenlage von oben gesehen. Hervorgehoben sind die Stellen, an denen bei langem Liegen ein Dekubitus entstehen kann.</desc>

  <defs>
    <linearGradient id="body-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5E6E0"/>
      <stop offset="50%" stop-color="#F0DAD2"/>
      <stop offset="100%" stop-color="#E8CEC5"/>
    </linearGradient>
    <linearGradient id="bed-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F1EC"/>
      <stop offset="100%" stop-color="#E8E0D5"/>
    </linearGradient>
  </defs>

  <!-- Bett / Matratze (Hintergrund) -->
  <rect x="2" y="4" width="46" height="92" rx="3" ry="3"
        fill="url(#bed-grad)" stroke="#C9BEA9" stroke-width="0.4"/>
  <line x1="3" y1="20" x2="47" y2="20" stroke="#D4C9B4" stroke-width="0.3" stroke-dasharray="1,1"/>
  <line x1="3" y1="80" x2="47" y2="80" stroke="#D4C9B4" stroke-width="0.3" stroke-dasharray="1,1"/>

  <!-- Körper-Kontur (Rückenlage, Blick von oben) -->
  <!-- Kopf -->
  <ellipse cx="12" cy="10" rx="5" ry="6"
           fill="url(#body-grad)" stroke="#B8958C" stroke-width="0.5"/>
  <!-- Hals -->
  <rect x="10" y="15" width="4" height="3" rx="1"
        fill="url(#body-grad)" stroke="#B8958C" stroke-width="0.4"/>

  <!-- Torso (Schultern breit, Taille schmal) -->
  <path d="M 4 20 Q 12 18 20 20 Q 22 35 22 45 Q 22 55 20 65 Q 12 67 4 65 Q 2 55 2 45 Q 2 35 4 20 Z"
        fill="url(#body-grad)" stroke="#B8958C" stroke-width="0.5"/>

  <!-- Linker Arm (aus Sicht des Patienten) -->
  <path d="M 3 22 Q 0 32 1 42 Q 2 50 4 48 Q 5 40 5 32 Q 5 26 3 22 Z"
        fill="url(#body-grad)" stroke="#B8958C" stroke-width="0.4"/>

  <!-- Rechter Arm -->
  <path d="M 21 22 Q 24 32 23 42 Q 22 50 20 48 Q 19 40 19 32 Q 19 26 21 22 Z"
        fill="url(#body-grad)" stroke="#B8958C" stroke-width="0.4"/>

  <!-- Hüfte/Becken -->
  <ellipse cx="12" cy="57" rx="10" ry="6"
           fill="url(#body-grad)" stroke="#B8958C" stroke-width="0.5"/>

  <!-- Linkes Bein -->
  <path d="M 5 62 Q 4 75 5 88 Q 7 92 9 92 Q 10 75 10 62 Z"
        fill="url(#body-grad)" stroke="#B8958C" stroke-width="0.5"/>
  <!-- Rechtes Bein -->
  <path d="M 14 62 Q 14 75 15 88 Q 17 92 19 92 Q 20 75 19 62 Z"
        fill="url(#body-grad)" stroke="#B8958C" stroke-width="0.5"/>

  <!-- Füße -->
  <ellipse cx="7" cy="93" rx="2.5" ry="2" fill="url(#body-grad)" stroke="#B8958C" stroke-width="0.4"/>
  <ellipse cx="17" cy="93" rx="2.5" ry="2" fill="url(#body-grad)" stroke="#B8958C" stroke-width="0.4"/>

  <!-- Prädilektionsstellen dezent markiert (Hotspot-Zonen) -->
  <!-- Hinterhaupt (12, 10) -->
  <circle cx="12" cy="10" r="2.5" fill="#C4877F" fill-opacity="0.25" stroke="#C4877F" stroke-width="0.4" stroke-dasharray="1,0.8"/>
  <!-- Schulterblätter (links + rechts, visualisiert bei ~x30 in Hotspot-Koordinaten → hier x=5 und x=19) -->
  <circle cx="5" cy="24" r="2" fill="#C4877F" fill-opacity="0.2" stroke="#C4877F" stroke-width="0.3" stroke-dasharray="0.8,0.6"/>
  <circle cx="19" cy="24" r="2" fill="#C4877F" fill-opacity="0.2" stroke="#C4877F" stroke-width="0.3" stroke-dasharray="0.8,0.6"/>
  <!-- Ellbogen links -->
  <circle cx="2.5" cy="44" r="1.8" fill="#C4877F" fill-opacity="0.2" stroke="#C4877F" stroke-width="0.3" stroke-dasharray="0.8,0.6"/>
  <circle cx="21.5" cy="44" r="1.8" fill="#C4877F" fill-opacity="0.2" stroke="#C4877F" stroke-width="0.3" stroke-dasharray="0.8,0.6"/>
  <!-- Kreuzbein (12, 57) -->
  <circle cx="12" cy="57" r="3" fill="#C4877F" fill-opacity="0.3" stroke="#C4877F" stroke-width="0.4" stroke-dasharray="1,0.8"/>
  <!-- Fersen -->
  <circle cx="7" cy="93" r="1.5" fill="#C4877F" fill-opacity="0.2" stroke="#C4877F" stroke-width="0.3" stroke-dasharray="0.8,0.6"/>
  <circle cx="17" cy="93" r="1.5" fill="#C4877F" fill-opacity="0.2" stroke="#C4877F" stroke-width="0.3" stroke-dasharray="0.8,0.6"/>

  <!-- Orientierungshilfe -->
  <text x="52" y="8" font-family="system-ui, sans-serif" font-size="2.5" fill="#78716c" font-weight="600">Rückenlage</text>
  <text x="52" y="12" font-family="system-ui, sans-serif" font-size="1.8" fill="#9B8E7E">(Blick von oben)</text>

  <!-- Achsen-Hinweise -->
  <text x="10" y="3" font-family="system-ui, sans-serif" font-size="1.8" fill="#9B8E7E">Kopf</text>
  <text x="8" y="99" font-family="system-ui, sans-serif" font-size="1.8" fill="#9B8E7E">Füße</text>
</svg>
