<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Herz — Interaktives Anatomie-Diagramm (D3.js)</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fafaf9;
    color: #1d1d1f;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 {
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 8px;
    color: #C4877F;
  }
  .subtitle {
    font-size: 14px;
    color: #78716c;
    margin-bottom: 16px;
  }
  #chart { background: #fff; border-radius: 16px; border: 1px solid #E5DFD6; }

  .tooltip {
    position: absolute;
    visibility: hidden;
    background: #fff;
    border: 2px solid #C4877F;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 13px;
    line-height: 1.5;
    max-width: 260px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    pointer-events: none;
    z-index: 10;
  }
  .tooltip .title {
    font-weight: 700;
    font-size: 15px;
    color: #C4877F;
    margin-bottom: 4px;
  }
  .tooltip .latin {
    font-style: italic;
    color: #78716c;
    font-size: 12px;
    margin-bottom: 6px;
  }
  .tooltip .desc {
    color: #44403c;
  }

  .info-panel {
    margin-top: 16px;
    padding: 16px 20px;
    background: #fff;
    border: 1px solid #E5DFD6;
    border-radius: 12px;
    max-width: 460px;
    width: 100%;
    min-height: 60px;
    transition: all 0.3s ease;
  }
  .info-panel .panel-title {
    font-weight: 700;
    font-size: 16px;
    color: #C4877F;
  }
  .info-panel .panel-latin {
    font-style: italic;
    color: #78716c;
    font-size: 13px;
    margin-bottom: 8px;
  }
  .info-panel .panel-desc {
    font-size: 14px;
    color: #44403c;
    line-height: 1.6;
  }
  .info-panel .panel-hint {
    font-size: 13px;
    color: #a8a29e;
  }

  .legend {
    display: flex;
    gap: 20px;
    margin-top: 12px;
    font-size: 13px;
    color: #78716c;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
  }
</style>
</head>
<body>

<h1>Herz — Interaktives Anatomie-Diagramm</h1>
<p class="subtitle">Klicke auf eine Struktur für Details. Hover für Kurzinfo.</p>

<svg id="chart" width="460" height="520"></svg>

<div class="legend">
  <div class="legend-item">
    <div class="legend-dot" style="background: #8AABB5;"></div>
    <span>O₂-armes Blut</span>
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background: #C96B5C;"></div>
    <span>O₂-reiches Blut</span>
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background: #6B8F71;"></div>
    <span>Klappen</span>
  </div>
</div>

<div class="info-panel" id="info">
  <p class="panel-hint">Tippe auf eine Herzstruktur, um mehr zu erfahren.</p>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
const structures = [
  // Chambers
  {
    id: 'ra', type: 'chamber',
    name: 'Rechter Vorhof', latin: 'Atrium dextrum',
    desc: 'Empfängt sauerstoffarmes Blut aus dem Körper über die obere und untere Hohlvene (V. cava superior/inferior). Dünne Wand (~2mm), da nur geringer Druck nötig ist.',
    path: 'M 100,120 C 100,100 180,80 210,90 C 240,100 250,140 250,170 L 250,220 C 250,240 230,250 210,250 L 140,250 C 120,250 100,240 100,220 Z',
    fill: '#B8D4DD', stroke: '#5A8A9A', labelX: 170, labelY: 180
  },
  {
    id: 'rv', type: 'chamber',
    name: 'Rechte Kammer', latin: 'Ventriculus dexter',
    desc: 'Pumpt sauerstoffarmes Blut in die Lunge (Lungenkreislauf). Dünnere Wand (~4mm) als die linke Kammer, da der Lungenwiderstand niedrig ist. Enthält Trabeculae carneae (Muskelleisten).',
    path: 'M 100,260 C 100,250 120,250 140,260 L 250,260 C 250,280 250,320 240,360 C 230,400 200,440 180,460 C 160,470 140,460 130,440 C 110,400 100,340 100,300 Z',
    fill: '#A3C5D2', stroke: '#5A8A9A', labelX: 170, labelY: 360
  },
  {
    id: 'la', type: 'chamber',
    name: 'Linker Vorhof', latin: 'Atrium sinistrum',
    desc: 'Empfängt sauerstoffreiches Blut aus der Lunge über die 4 Lungenvenen (Vv. pulmonales). Liegt am weitesten hinten im Herz, direkt vor der Speiseröhre.',
    path: 'M 260,120 C 260,100 300,80 340,90 C 370,100 380,130 380,170 L 380,220 C 380,240 360,250 340,250 L 300,250 C 280,250 260,240 260,220 Z',
    fill: '#E8B5AF', stroke: '#C96B5C', labelX: 320, labelY: 180
  },
  {
    id: 'lv', type: 'chamber',
    name: 'Linke Kammer', latin: 'Ventriculus sinister',
    desc: 'Pumpt sauerstoffreiches Blut in den Körper (Körperkreislauf). Dickste Wand (~13mm) aller Herzkammern — 3× dicker als die rechte Kammer. Erzeugt den systemischen Blutdruck.',
    path: 'M 260,260 L 380,260 C 380,280 380,320 370,360 C 360,400 330,440 300,460 C 280,470 260,450 250,420 C 230,380 260,320 260,300 Z',
    fill: '#D4A09A', stroke: '#C96B5C', labelX: 320, labelY: 360
  },
  // Septum
  {
    id: 'septum', type: 'wall',
    name: 'Herzscheidewand', latin: 'Septum interventriculare',
    desc: 'Trennt linkes und rechtes Herz vollständig. Besteht aus einem muskulären und einem membranösen Teil. Verhindert die Mischung von sauerstoffarmem und sauerstoffreichem Blut.',
    path: 'M 250,130 C 255,200 258,300 260,460 L 255,460 C 253,300 250,200 248,130 Z',
    fill: '#D4956A', stroke: '#B07A47', labelX: 252, labelY: 310
  },
  // Valves
  {
    id: 'tk', type: 'valve',
    name: 'Trikuspidalklappe', latin: 'Valva tricuspidalis',
    desc: '3 Segel (Cuspes): anterior, posterior, septal. Verhindert Rückfluss vom rechten Ventrikel in den rechten Vorhof. Segelklappen werden durch Sehnenfäden (Chordae tendineae) an Papillarmuskeln gehalten.',
    path: 'M 110,250 L 170,240 L 240,250 L 170,260 Z',
    fill: '#6B8F71', stroke: '#4A6B50', labelX: 170, labelY: 250
  },
  {
    id: 'mk', type: 'valve',
    name: 'Mitralklappe', latin: 'Valva mitralis (bicuspidalis)',
    desc: '2 Segel: vorderes (größer) und hinteres (kleiner). Einzige Herzklappe mit nur 2 Segeln. Verhindert Rückfluss vom linken Ventrikel in den linken Vorhof. Benannt nach der Bischofsmütze (Mitra).',
    path: 'M 270,250 L 320,240 L 370,250 L 320,260 Z',
    fill: '#6B8F71', stroke: '#4A6B50', labelX: 320, labelY: 250
  },
  {
    id: 'pk', type: 'valve',
    name: 'Pulmonalklappe', latin: 'Valva trunci pulmonalis',
    desc: '3 halbmondförmige Taschen (Valvulae semilunares). Verhindert Rückfluss aus der Lungenarterie in die rechte Kammer. Öffnet sich bei der Systole, wenn der Druck im Ventrikel den Lungendruck übersteigt.',
    path: 'M 110,115 L 140,105 L 170,115 L 140,125 Z',
    fill: '#6B8F71', stroke: '#4A6B50', labelX: 140, labelY: 115
  },
  {
    id: 'ak', type: 'valve',
    name: 'Aortenklappe', latin: 'Valva aortae',
    desc: '3 halbmondförmige Taschen. Verhindert Rückfluss aus der Aorta in die linke Kammer. Die Koronararterien (Herzkranzgefäße) entspringen direkt oberhalb der Klappe aus den Sinus aortae.',
    path: 'M 300,115 L 330,105 L 360,115 L 330,125 Z',
    fill: '#6B8F71', stroke: '#4A6B50', labelX: 330, labelY: 115
  },
  // Vessels
  {
    id: 'vcs', type: 'vessel',
    name: 'Obere Hohlvene', latin: 'Vena cava superior',
    desc: 'Sammelt sauerstoffarmes Blut aus Kopf, Hals, Armen und oberem Thorax. Mündet von oben in den rechten Vorhof. Kein Klappenapparat — der Blutrückfluss wird durch den Atemrhythmus reguliert.',
    path: 'M 120,30 C 120,30 110,60 110,90 C 110,100 115,110 120,120 L 140,120 C 140,110 135,100 135,90 C 135,60 140,30 140,30 Z',
    fill: '#8AABB5', stroke: '#5A8A9A', labelX: 130, labelY: 50
  },
  {
    id: 'aorta', type: 'vessel',
    name: 'Aorta', latin: 'Aorta ascendens → Arcus aortae',
    desc: 'Größte Arterie des Körpers. Entspringt aus der linken Kammer, steigt auf (Aorta ascendens), bildet den Aortenbogen (Arcus aortae) und zieht als Aorta descendens nach unten. Durchmesser ~2,5cm, Wanddicke ~2mm.',
    path: 'M 320,30 C 330,30 340,40 340,60 C 340,80 335,100 330,110 L 310,110 C 315,100 320,80 320,60 C 320,40 310,30 320,30 Z',
    fill: '#D4A09A', stroke: '#C96B5C', labelX: 330, labelY: 50
  },
  {
    id: 'tp', type: 'vessel',
    name: 'Truncus pulmonalis', latin: 'Truncus pulmonalis',
    desc: 'Lungenarterie — führt sauerstoffarmes Blut von der rechten Kammer zur Lunge. Teilt sich in A. pulmonalis dextra und sinistra. Trotz des Namens "Arterie" transportiert sie sauerstoffarmes Blut.',
    path: 'M 140,50 C 155,50 170,55 180,65 C 200,85 190,100 180,110 L 165,100 C 175,90 180,80 165,70 C 158,62 148,58 140,58 Z',
    fill: '#8AABB5', stroke: '#5A8A9A', labelX: 170, labelY: 72
  },
  {
    id: 'vp', type: 'vessel',
    name: 'Lungenvenen', latin: 'Venae pulmonales (4×)',
    desc: '4 Lungenvenen (je 2 rechts, 2 links) bringen sauerstoffreiches Blut aus der Lunge zum linken Vorhof. Einzige Venen im Körper, die sauerstoffreiches Blut führen.',
    path: 'M 370,130 C 390,125 410,120 420,110 L 430,120 C 420,130 400,138 380,142 Z',
    fill: '#D4A09A', stroke: '#C96B5C', labelX: 405, labelY: 120
  }
];

const svg = d3.select('#chart');
const tooltip = d3.select('#tooltip');
const infoPanel = d3.select('#info');

// Background
svg.append('rect')
  .attr('width', 460)
  .attr('height', 520)
  .attr('rx', 16)
  .attr('fill', '#fafaf9');

// Title inside SVG
svg.append('text')
  .attr('x', 230)
  .attr('y', 25)
  .attr('text-anchor', 'middle')
  .attr('font-size', '11px')
  .attr('fill', '#a8a29e')
  .text('Sectio coronalis — Frontalschnitt');

// Draw structures
const structureGroups = svg.selectAll('.structure')
  .data(structures)
  .join('g')
  .attr('class', 'structure')
  .style('cursor', 'pointer');

// Paths
structureGroups.append('path')
  .attr('d', d => d.path)
  .attr('fill', d => d.fill)
  .attr('stroke', d => d.stroke)
  .attr('stroke-width', 2)
  .attr('opacity', 0.9)
  .on('mouseover', function(event, d) {
    d3.select(this)
      .transition().duration(150)
      .attr('opacity', 1)
      .attr('stroke-width', 3);

    tooltip.style('visibility', 'visible')
      .html(`<div class="title">${d.name}</div><div class="latin">${d.latin}</div><div class="desc">${d.desc.substring(0, 80)}...</div>`);
  })
  .on('mousemove', function(event) {
    tooltip
      .style('top', (event.pageY - 10) + 'px')
      .style('left', (event.pageX + 15) + 'px');
  })
  .on('mouseout', function() {
    d3.select(this)
      .transition().duration(150)
      .attr('opacity', 0.9)
      .attr('stroke-width', 2);
    tooltip.style('visibility', 'hidden');
  })
  .on('click', function(event, d) {
    // Highlight selected
    svg.selectAll('.structure path')
      .transition().duration(200)
      .attr('opacity', 0.4)
      .attr('stroke-width', 1.5);

    d3.select(this)
      .transition().duration(200)
      .attr('opacity', 1)
      .attr('stroke-width', 4);

    // Update info panel
    infoPanel.html(`
      <div class="panel-title">${d.name}</div>
      <div class="panel-latin">${d.latin}</div>
      <div class="panel-desc">${d.desc}</div>
    `);
  });

// Labels
structureGroups.append('text')
  .attr('x', d => d.labelX)
  .attr('y', d => d.labelY)
  .attr('text-anchor', 'middle')
  .attr('font-size', d => d.type === 'valve' ? '9px' : '11px')
  .attr('font-weight', d => d.type === 'chamber' ? '600' : '400')
  .attr('fill', d => {
    if (d.type === 'valve') return '#fff';
    if (d.type === 'wall') return '#fff';
    return '#1d1d1f';
  })
  .attr('pointer-events', 'none')
  .text(d => {
    if (d.type === 'chamber') return d.name.split(' ')[1] || d.name;
    if (d.type === 'valve') return d.name.replace('klappe', '');
    if (d.type === 'vessel') return '';
    return d.name;
  });

// Vessel labels (smaller, outside)
const vesselLabels = [
  { id: 'vcs', x: 60, y: 55, text: 'V. cava\nsuperior', anchor: 'end' },
  { id: 'aorta', x: 370, y: 40, text: 'Aorta', anchor: 'start' },
  { id: 'tp', x: 210, y: 58, text: 'Tr. pulmonalis', anchor: 'start' },
  { id: 'vp', x: 435, y: 140, text: 'Vv. pulmonales', anchor: 'start' },
];

vesselLabels.forEach(vl => {
  const lines = vl.text.split('\n');
  const textEl = svg.append('text')
    .attr('x', vl.x)
    .attr('y', vl.y)
    .attr('text-anchor', vl.anchor)
    .attr('font-size', '10px')
    .attr('fill', '#78716c')
    .attr('pointer-events', 'none');

  lines.forEach((line, i) => {
    textEl.append('tspan')
      .attr('x', vl.x)
      .attr('dy', i === 0 ? 0 : '1.2em')
      .text(line);
  });
});

// Flow arrows
const flowPaths = [
  // VCS -> RA
  { d: 'M 130,90 L 150,140', color: '#5A8A9A' },
  // RA -> RV (through TK)
  { d: 'M 170,230 L 170,280', color: '#5A8A9A' },
  // RV -> Lungenarterie
  { d: 'M 140,290 C 130,250 130,180 140,130', color: '#5A8A9A' },
  // Lungenvenen -> LA
  { d: 'M 395,130 L 365,160', color: '#C96B5C' },
  // LA -> LV (through MK)
  { d: 'M 320,230 L 320,280', color: '#C96B5C' },
  // LV -> Aorta
  { d: 'M 330,290 C 340,250 340,180 330,130', color: '#C96B5C' },
];

// Arrow marker
svg.append('defs').selectAll('marker')
  .data(['arrow-blue', 'arrow-red'])
  .join('marker')
  .attr('id', d => d)
  .attr('markerWidth', 8)
  .attr('markerHeight', 6)
  .attr('refX', 7)
  .attr('refY', 3)
  .attr('orient', 'auto')
  .append('polygon')
  .attr('points', '0 0, 8 3, 0 6')
  .attr('fill', d => d === 'arrow-blue' ? '#5A8A9A' : '#C96B5C');

flowPaths.forEach(fp => {
  svg.append('path')
    .attr('d', fp.d)
    .attr('fill', 'none')
    .attr('stroke', fp.color)
    .attr('stroke-width', 2)
    .attr('stroke-dasharray', '6,3')
    .attr('opacity', 0.6)
    .attr('marker-end', fp.color === '#5A8A9A' ? 'url(#arrow-blue)' : 'url(#arrow-red)')
    .attr('pointer-events', 'none');
});

// O2 badges
[
  { x: 130, y: 490, text: 'O₂-arm', color: '#5A8A9A', bg: '#E8F1F4' },
  { x: 340, y: 490, text: 'O₂-reich', color: '#C96B5C', bg: '#F5E6E4' },
].forEach(badge => {
  const g = svg.append('g');
  g.append('rect')
    .attr('x', badge.x - 35)
    .attr('y', badge.y - 12)
    .attr('width', 70)
    .attr('height', 24)
    .attr('rx', 12)
    .attr('fill', badge.bg)
    .attr('stroke', badge.color)
    .attr('stroke-width', 1);
  g.append('text')
    .attr('x', badge.x)
    .attr('y', badge.y + 4)
    .attr('text-anchor', 'middle')
    .attr('font-size', '11px')
    .attr('font-weight', '600')
    .attr('fill', badge.color)
    .text(badge.text);
});

// Reset on background click
svg.on('click', function(event) {
  if (event.target === this || event.target.tagName === 'rect') {
    svg.selectAll('.structure path')
      .transition().duration(200)
      .attr('opacity', 0.9)
      .attr('stroke-width', 2);

    infoPanel.html('<p class="panel-hint">Tippe auf eine Herzstruktur, um mehr zu erfahren.</p>');
  }
});
</script>
</body>
</html>
